services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: eems
      POSTGRES_USER: eems_user
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eems_user -d eems"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    container_name: backend
    image: eems-backend
    build:
      context: "./Electronic Election Management System"
      dockerfile: "Electronic Election Management System/Dockerfile"
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # The database provider is a plugin, so loading has to be on for the app to reach any
      # database at all. Double underscore is how .NET maps Plugins:Enabled to an env var.
      Plugins__Enabled: "true"
    ports:
      - "7104:8080"
    volumes:
      - backend-data:/app/data

volumes:
  postgres-data:
  backend-data: