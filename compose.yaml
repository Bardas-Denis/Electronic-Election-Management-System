services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: eems
      POSTGRES_USER: eems_user
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eems_user -d eems"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: